<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <title>Ganesh Balaraju — Revenue Operations Analyst</title>
    <meta
      name="description"
      content="Revenue Operations Analyst in Berlin. HubSpot CRM ownership, process automation and pipeline reporting, backed by an engineering background in Python, SQL and React."
    />
    <meta name="author" content="Ganesh Balaraju" />
    <link rel="canonical" href="https://ganeshbalaraju.github.io/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ganesh Balaraju — Revenue Operations Analyst" />
    <meta
      property="og:description"
      content="HubSpot CRM ownership, process automation and pipeline reporting — built, not just recommended. Berlin, available from October 2026."
    />
    <meta property="og:url" content="https://ganeshbalaraju.github.io/" />
    <meta property="og:image" content="%PUBLIC_URL%/HeroImage.jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ganesh Balaraju — Revenue Operations Analyst" />
    <meta
      name="twitter:description"
      content="HubSpot CRM ownership, process automation and pipeline reporting — built, not just recommended."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/HeroImage.jpeg" />

    <!--
      These were previously href="" which makes the browser resolve the empty
      string against the current URL and re-request the page itself — three
      extra document requests on every load.
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/HeroImage.jpeg" />

    <!--
      Fonts moved out of App.css: an @import there serialises the font request
      behind the stylesheet parse. Preconnecting and loading here lets both
      happen in parallel. Only the weights actually used are requested.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    />

    <!-- Hero portrait is the largest contentful paint — start it immediately. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/HeroImage.jpeg" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ganesh Balaraju",
        "jobTitle": "Revenue Operations Analyst",
        "email": "mailto:ganeshbalarajude@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Berlin",
          "addressCountry": "DE"
        },
        "sameAs": [
          "https://github.com/GaneshMandakapu",
          "https://www.linkedin.com/in/ganeshbalaraju/"
        ]
      }
    </script>

    <script src="https://counterapi.com/c.js?ns=ganeshbalaraju" async></script>
  </head>
  <body>
